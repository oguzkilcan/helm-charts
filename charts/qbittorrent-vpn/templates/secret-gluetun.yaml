{{- if .Values.gluetun.envSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qbittorrent-vpn.fullname" . }}-gluetun
  labels:
    {{- include "qbittorrent-vpn.labels" . | nindent 4 }}
data:
{{- range $key, $value := .Values.gluetun.envSecret }}
  {{ $key }}: {{ $value | b64enc | quote }}
{{- end }}
{{- end }}
