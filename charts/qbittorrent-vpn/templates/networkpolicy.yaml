{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.ips }}
{{- fail "networkPolicy.ips must not be empty when networkPolicy is enabled" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "qbittorrent-vpn.fullname" . }}
  labels:
    {{- include "qbittorrent-vpn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "qbittorrent-vpn.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
    {{- if .Values.networkPolicy.ingressFrom }}
    - Ingress
    {{- end }}
  egress:
    - to:
        {{- range .Values.networkPolicy.ips }}
        - ipBlock:
            cidr: {{ . }}/32
        {{- end }}
      ports:
        - protocol: UDP
          port: {{ .Values.networkPolicy.port }}
  {{- with .Values.networkPolicy.ingressFrom }}
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8080
  {{- end }}
{{- end }}
